[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-sentinel"
version = "1.0.0"
description = "Detection-only WordPress security scanner — observes misconfigurations, never exploits. Zero dependencies, exit codes for CI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohamed Mohsen" }]
keywords = ["wordpress", "security", "scanner", "devsecops", "misconfiguration", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
wp-sentinel = "wpsentinel.cli:main"

[project.urls]
Homepage = "https://github.com/RootX22/wp-sentinel"
Issues = "https://github.com/RootX22/wp-sentinel/issues"

[tool.setuptools.packages.find]
include = ["wpsentinel*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
